services:
  - type: web
    name: gaia-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GAIA_SECRET_KEY
        sync: false
      - key: GAIA_GOOGLE_CLIENT_IDS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GAIA_REQUIRE_SUPABASE_HOST
        value: "false"
